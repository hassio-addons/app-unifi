# HA ingress reverse proxy for the UniFi Network Application UI.
#
# Why this exists: the UniFi SPA hardcodes that it lives at the web root
# (`<base href="/manage/">`, API at `/`, router basename `/manage`, WebSockets
# at `/wss/...`). HA ingress serves the app under a stripped path prefix
# (`/api/hassio_ingress/<token>/`) and over plain HTTP, while UniFi is HTTPS
# only on 8443. Upstream declared inline ingress impossible for these reasons.
#
# The whole UI stack funnels its base path through a small set of *content*
# literals (stable across the per-release bundle-hash renames). Rewriting those
# literals to carry the live ingress prefix (the X-Ingress-Path header HA
# injects on every request) lets the UI run correctly behind the prefix. The
# prefix is dynamic per session, so the rewrite is done here at request time
# rather than baked into the files at build time.
server {
    listen 8099;

    # Ingress traffic only ever arrives from the Supervisor.
    allow 172.30.32.2;
    deny all;

    location / {
        # HA strips the ingress prefix before forwarding, so the back end is
        # addressed at root. UniFi is HTTPS-only with a self-signed cert.
        proxy_pass https://127.0.0.1:8443/;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # UniFi rejects POSTs whose Origin/Referer don't match its own
        # scheme/host/port (CSRF guard). The proxy changes both, so strip them.
        # Note this removes UniFi's own token-based CSRF cover on the ingress
        # path: X-Csrf-Token is injected below from the same csrf cookie that is
        # forwarded, so UniFi's double-submit check is self-satisfying (that
        # injection is a functional necessity for the SPA, not a security
        # control). The real CSRF protection here is Home Assistant: reaching
        # this app requires the unguessable per-session ingress URL behind HA
        # authentication, so an off-site page cannot form the request; and the
        # session cookies are downgraded to SameSite=Lax below, so they are not
        # sent on cross-site POSTs.
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        # Forward only UniFi's own cookies (see the maps in nginx.conf). The
        # browser holds them under namespaced *_ing names (see the Set-Cookie
        # note below); the maps strip the _ing suffix so UniFi receives its
        # original unifises / csrf_token names. This also drops the Home
        # Assistant cookies the browser sends to this same-origin path, keeping
        # the request under UniFi's Jetty 8 KB header limit so it does not answer
        # 400 Bad Request.
        proxy_set_header Cookie "$unifi_c_session; $unifi_c_csrf";

        # The session cookies are namespaced to *_ing on the wire (see the
        # Set-Cookie note below), so the SPA's JS can no longer read csrf_token
        # to populate the X-Csrf-Token header. Inject it here from the namespaced
        # cookie so UniFi's CSRF check still sees a matching cookie/header pair.
        proxy_set_header X-Csrf-Token $unifi_csrf_value;

        # UniFi sets its session (unifises) and csrf_token cookies with the
        # Secure attribute (and SameSite=None, which itself requires Secure). It
        # marks them Secure on every response because its own listener is HTTPS
        # (this proxy reaches it at https://127.0.0.1:8443), independent of how
        # the browser reached Home Assistant. HA ingress, however, serves this
        # app to the browser over plain HTTP, and browsers refuse to store or
        # send a Secure cookie on a non-secure origin: POST /api/login returns
        # 200 and sets the cookies, the browser drops them, the next /api/self is
        # 401, and the UI loops back to the login page.
        #
        # So strip Secure from every Set-Cookie, unconditionally. This is exactly
        # what `proxy_cookie_flags ~ nosecure;` does; that directive needs nginx
        # >= 1.19.3 and the focal base ships 1.18, so we do it in Lua here. When
        # the base image moves to nginx >= 1.19.3, delete this block and the Lua
        # module and use the directive instead.
        #
        # The strip is unconditional on purpose: it is NOT gated on
        # X-Forwarded-Proto. Supervisor does not set that header (it only adds
        # X-Forwarded-For), so any value present comes from whatever fronts HA
        # and can read "https" even when the browser origin is plain HTTP, which
        # is precisely what broke login in 20260613-08/-09. The ingress edge is
        # always plain HTTP, so dropping Secure is always correct here; an
        # HTTPS-origin browser still works fine with a non-Secure cookie. This
        # matches peer ingress apps, whose cookies are not Secure either.
        # SameSite=None is downgraded to Lax in lockstep because None without
        # Secure is rejected outright. pcall-guarded so a malformed cookie can
        # never fault the response.
        #
        # Set-Cookie names are also namespaced: unifises -> unifises_ing and
        # csrf_token -> csrf_token_ing. UniFi serves its own UI over HTTPS on
        # 8443, and reaching that directly (the "Open Web UI" button) plants
        # Secure unifises / csrf_token cookies for the same host, because cookies
        # ignore port. Browsers then refuse to let this plain-HTTP ingress
        # overwrite a Secure cookie of the same name ("leave secure cookies
        # alone"), so the freshly issued login cookies were rejected and login
        # looped even with Secure stripped (confirmed in Firefox: "Cookie
        # 'unifises' has been rejected because there is an existing 'secure'
        # cookie"). Path-scoping does not help: the 8443 cookie sits at Path=/,
        # which prefix-matches every deeper path. Renaming sidesteps the
        # collision entirely, the *_ing cookies never clash with the 8443 ones.
        # The maps in nginx.conf rename them back on the way in, and X-Csrf-Token
        # is injected above since the SPA can no longer read the renamed cookie.
        header_filter_by_lua_block {
            pcall(function()
                local sc = ngx.header["Set-Cookie"]
                if not sc then return end
                local list = type(sc) == "table" and sc or { sc }
                local out = {}
                for i, c in ipairs(list) do
                    local f = c:gsub(";%s*[Ss][Ee][Cc][Uu][Rr][Ee]", "")
                    f = f:gsub("([Ss][Aa][Mm][Ee][Ss][Ii][Tt][Ee])=[Nn][Oo][Nn][Ee]", "%1=Lax")
                    f = f:gsub("^unifises=", "unifises_ing=")
                    f = f:gsub("^csrf_token=", "csrf_token_ing=")
                    out[i] = f
                end
                ngx.header["Set-Cookie"] = out
            end)
        }

        # Cloudflare (Access / Tunnel) in front of Home Assistant injects large
        # request headers UniFi has no use for, the Cf-Access-Jwt-Assertion JWT
        # in particular can run to several KB. Left in place they count toward
        # UniFi's 8 KB header limit and trip the same 400. Drop them all.
        proxy_set_header Cf-Access-Jwt-Assertion "";
        proxy_set_header Cf-Access-Authenticated-User-Email "";
        proxy_set_header Cf-Access-Authenticated-User-Id "";
        proxy_set_header Cf-Connecting-Ip "";
        proxy_set_header Cf-Ipcountry "";
        proxy_set_header Cf-Ray "";
        proxy_set_header Cf-Visitor "";
        proxy_set_header Cf-Worker "";
        proxy_set_header Cf-Warp-Tag-Id "";
        proxy_set_header Cdn-Loop "";

        # sub_filter only rewrites uncompressed responses.
        proxy_set_header Accept-Encoding "";

        # UniFi sends HSTS, which would poison the HA origin and force-upgrade
        # it to https on a port where nothing listens.
        proxy_hide_header Strict-Transport-Security;

        # UniFi emits no Content-Security-Policy on any response this proxy
        # handles (verified against 10.5.67: none on the login page, static
        # bundles, or API, and no CSP header or <meta> anywhere in the package).
        # So these directives drop nothing today; they are a forward-guard. If a
        # future UniFi build adds a CSP, it would assume the app sits at the web
        # root and could block the framed, path-rewritten bundles, so its
        # response-header form is stripped here rather than allowed to silently
        # break the sidebar (a <meta>-tag CSP would instead need a sub_filter).
        # Access to this path is already gated by Home Assistant ingress auth.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        # The app emits root-relative redirects (e.g. /manage/account/login).
        # Keep Location relative and re-prefix it so the browser stays inside
        # the ingress path instead of escaping it.
        absolute_redirect off;
        proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;

        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;

        # 1. Static asset anchor (index.html): carry the live ingress prefix on
        #    the SPA base href. Anchored on the <base> literal, which the startup
        #    canary in init-unifi verifies still exists after a UniFi upgrade.
        sub_filter '<base href="/manage/">' '<base href="$http_x_ingress_path/manage/">';
        # 2. SPA constant consumed by the chunk loader (angular index.js)
        sub_filter 'BASE_HREF:"/manage/"' 'BASE_HREF:"$http_x_ingress_path/manage/"';
        # 3. API adapter root: XHR and WebSocket URLs derive from this (index.js)
        sub_filter 'apiAdapter:new i.default("/")' 'apiAdapter:new i.default("$http_x_ingress_path/")';
        # 4. Router basename: in standalone+local mode swai hardcodes
        #    a.baseUrl="/manage/", which becomes the React Router basename.
        #    Carry the full ingress path so the router resolves "/" correctly.
        sub_filter 'baseUrl="/manage/"' 'baseUrl="$http_x_ingress_path/manage/"';
        # 5. Setup wizard (separate mini-app with its own absolute paths)
        sub_filter '<base href="/setup/"/>' '<base href="$http_x_ingress_path/setup/"/>';
        sub_filter 'href="/setup/' 'href="$http_x_ingress_path/setup/';
        sub_filter 'src="/setup/' 'src="$http_x_ingress_path/setup/';
        # 6. Setup wizard API client (single axios instance in main.js)
        sub_filter 'baseURL:"/",withCredentials' 'baseURL:"$http_x_ingress_path/",withCredentials';
        # 7. Setup wizard webpack publicPath. The setup bundle sets its asset
        #    base to an absolute "/setup/" (minified as <var>.p="/setup/"), so
        #    webpack-loaded assets (fonts, lazy chunks) are fetched from
        #    /setup/static/... at the origin root and escape the ingress prefix
        #    and 404, even though the files exist. base href does not help here
        #    because webpack uses publicPath, not the document base, to build
        #    asset URLs. Carry the prefix so they resolve under it. The literal
        #    .p="/setup/" occurs exactly once in the bundles. The manage app
        #    needs no equivalent: its publicPath is empty and resolves correctly
        #    against the rewritten base href.
        sub_filter '.p="/setup/"' '.p="$http_x_ingress_path/setup/"';
    }
}
