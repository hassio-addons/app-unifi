# Minimal nginx for HA ingress. The ingress-nginx service symlinks
# ingress-proxy.conf to active-server.conf, then this file includes it.

# Lua is required by the header_filter_by_lua_block in ingress-proxy.conf that
# relaxes UniFi's Secure session cookies (and namespaces them to *_ing so they
# do not collide with the Secure cookies UniFi's 8443 UI sets) when Home
# Assistant is reached over plain HTTP, so the browser stores them and the
# login does not loop.
load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;

daemon off;
user root;
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Troubleshooting log: emit a line only for failed responses (4xx/5xx), never
    # for 2xx/3xx, so the app Log tab stays quiet in normal use but surfaces a
    # font/asset 404 or a proxy failure while testing a build.
    #
    # Token-safe by construction. The ingress prefix and per-session token arrive
    # in the X-Ingress-Path header (not logged) and in Referer (deliberately not
    # in this format); the request URI Supervisor forwards is already prefix- and
    # token-stripped. Do NOT switch this to the stock "combined" format: it logs
    # Referer, which would write the session token into the log.
    map $status $loggable {
        ~^[23]  0;
        default 1;
    }
    log_format ingress_err '$status $request_method $uri ${body_bytes_sent}b ua="$http_user_agent"';
    access_log /dev/stderr ingress_err if=$loggable;
    error_log /dev/stderr warn;

    # Required so the proxied WebSocket upgrade is forwarded correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The UniFi standalone controller authenticates with just two small cookies
    # (unifises + csrf_token). HA serves this panel same-origin under its own
    # domain, so the browser sends every Home Assistant cookie to the ingress
    # path too. Those foreign cookies are useless to UniFi and can push the
    # request headers past UniFi's embedded Jetty 8 KB limit, which makes Jetty
    # answer 400 Bad Request (most visible in the HA companion app, whose
    # WebView carries a larger cookie jar). Extract only UniFi's own cookies and
    # forward just those (see ingress-proxy.conf).
    #
    # On the wire the two cookies are namespaced to unifises_ing / csrf_token_ing
    # (renamed in the Set-Cookie filter in ingress-proxy.conf) so they cannot
    # collide with the Secure unifises / csrf_token that UniFi's own 8443 HTTPS
    # UI sets for the same host. These maps match the _ing names and re-emit the
    # original names, so UniFi receives the cookies it expects. A bare Secure
    # unifises left over from an 8443 visit no longer matches and is ignored.
    map $http_cookie $unifi_c_session {
        default "";
        "~(?:^|;\s*)unifises_ing=([^;]+)"   "unifises=$1";
    }
    map $http_cookie $unifi_c_csrf {
        default "";
        "~(?:^|;\s*)csrf_token_ing=([^;]+)" "csrf_token=$1";
    }
    # Bare token value (no name=) for the injected X-Csrf-Token header, since the
    # SPA's JS can no longer read the renamed csrf cookie to send it itself.
    map $http_cookie $unifi_csrf_value {
        default "";
        "~(?:^|;\s*)csrf_token_ing=([^;]+)" "$1";
    }

    # Accept the large incoming request (the companion app's cookie jar) so we
    # can trim it before proxying, instead of nginx rejecting it outright.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 16k;

    client_max_body_size 0;
    proxy_buffering off;

    include /etc/nginx/active-server.conf;
}
