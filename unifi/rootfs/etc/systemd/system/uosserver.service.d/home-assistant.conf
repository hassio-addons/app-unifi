[Unit]
# Stop the controller before its user bus/delegated cgroups disappear.
Requires=user@1001.service
After=user@1001.service

[Service]
# App-owned override; vendor base unit remains unchanged.
# Override the vendor unit's user only while the fixed wrapper prepares a
# separate namespace. The final service process runs as uosserver, not root.
User=root
Group=root
ExecStart=
ExecStart=/usr/local/bin/unifi-os-rootless-service
# "+" runs these root checks outside the namespace below.
ExecStartPre=+/usr/local/bin/unifi-os-state-ownership
ExecStartPre=+/usr/local/bin/unifi-os-exec-guard /var/lib/uosserver/bin/uosserver-service
ExecStartPre=/usr/bin/rm -f /run/user/1001/unifi-rootless-ready
ExecStopPost=/usr/bin/rm -f /run/user/1001/unifi-rootless-ready
ExecStopPost=/usr/local/bin/unifi-os-storage-cleanup
ExecStartPost=/usr/local/bin/unifi-os-network-options
# The Home Assistant credential is for app notification services only; the
# worker also covers it in its own namespace.
InaccessiblePaths=-/run/unifi-ha-api -/run/credentials
TimeoutStartSec=300
