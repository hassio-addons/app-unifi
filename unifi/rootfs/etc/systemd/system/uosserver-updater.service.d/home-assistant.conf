[Service]
# App-owned override; vendor base unit remains unchanged. This is a
# permissions sandbox for the root updater, which acts on requests from the
# UID-1001 runtime (restart, legacy Network export, OS update).
# "+" runs these root checks outside the sandbox below.
ExecStartPre=+/usr/local/bin/unifi-os-state-ownership
ExecStartPre=+/usr/local/bin/unifi-os-exec-guard /var/lib/uosserver/bin/updater-service
# Permit the vendor's native legacy export.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
ProtectSystem=strict
# Without this, strict leaves /home, /root and /run/user writable.
ProtectHome=read-only
# /run stays writable: the updater binds /run/uosserver-updater.sock there and
# rootless Podman uses /run/user/1001.
ReadWritePaths=/run /run/user/1001 /tmp /var/lib/unifi-os-app/uos/home /var/lib/uosserver/logs
# UniFi OS updates arrive only with app releases. The vendor update path
# copies a downloaded installer to a writable location and executes it as
# root: every writable path is also non-executable (W^X), so it cannot run.
# The receipt/version guards refuse any drift that still happens. Each
# writable path is listed again here: systemd applies NoExecPaths=/ and
# ExecPaths= per entry, so a broader rule would not cover these.
NoExecPaths=/run /run/user/1001 /tmp /var/lib/unifi-os-app/uos/home /var/lib/uosserver/logs /dev
# Without the legacy layout, /lib/unifi/data is the app's whole storage root:
# an executable alias of the writable directories above. Hide it behind an
# empty read-only tmpfs; the entrypoint replaces this with a writable,
# non-executable /lib/unifi/data when the legacy layout is bound there.
TemporaryFileSystem=/usr/lib/unifi/data:ro,nosuid,nodev,noexec,mode=0755
# Writable unit/generator directories would let root escape this sandbox via
# systemd. Sockets in them still work read-only.
ReadOnlyPaths=/run/systemd -/run/unifi-os-alerts
# App secrets and state the updater never needs.
InaccessiblePaths=-/run/unifi-ha-api -/run/credentials -/run/unifi-os-app
InaccessiblePaths=-/run/unifi-os-options.json -/run/unifi-os-ingress-policy.conf
InaccessiblePaths=-/run/unifi-os-console-port -/run/unifi-os-log.pipe
InaccessiblePaths=-/var/lib/unifi-os-app/uos/bootstrap
# Docker's read-only /proc/sys and enforcing AppArmor protect tunables. Avoid
# systemd's redundant /sys/kernel/debug self-bind, rejected by alias denials.
# The updater has no SYS_ADMIN capability and retains its strict write allowlist.
ProtectKernelTunables=no
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SETUID CAP_SETGID
SystemCallArchitectures=native
LockPersonality=yes
RestrictRealtime=yes
# No RestrictSUIDSGID=: its filter breaks GNU tar (ENOSYS on stat), and
# Podman archives files for the legacy export.
