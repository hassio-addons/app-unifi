# Experimental app-owned adapter. Vendor configuration/files are not changed.
# Use only after isolated ingress qualification; this is not a generic proxy.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes 1;
pid /run/unifi-os-ingress/nginx.pid;
error_log stderr error;

events {
    worker_connections 1024;
}

http {
    include /run/unifi-os-ingress-policy.conf;
    js_import ingress_cookies from /usr/share/unifi-os/ingress-cookies.js;
    js_import ingress_login from /usr/share/unifi-os/ingress-login.js;
    js_set $ingress_upstream_cookie ingress_cookies.upstreamCookie;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /run/unifi-os-ingress/client;
    proxy_temp_path /run/unifi-os-ingress/proxy;
    fastcgi_temp_path /run/unifi-os-ingress/fastcgi;
    uwsgi_temp_path /run/unifi-os-ingress/uwsgi;
    scgi_temp_path /run/unifi-os-ingress/scgi;

    # Supervisor supplies this header. Never reflect arbitrary header text into
    # HTML, JavaScript, redirects or cookie paths.
    map $http_x_ingress_path $ingress_path {
        default "";
        ~^/api/hassio_ingress/[A-Za-z0-9_-]+$ $http_x_ingress_path;
    }
    map $http_upgrade $ingress_connection {
        default upgrade;
        "" close;
    }
    # Upstream sees exactly one of two protocol values, never header text.
    # Like every nginx map string, "https" is compared case-insensitively.
    map $http_x_forwarded_proto $ingress_forwarded_proto {
        default http;
        https https;
    }
    map "$http_x_forwarded_proto:$ingress_http_compat_enabled" $ingress_needs_secure_login {
        # Missing/ambiguous protocol metadata must not forward a login body.
        default 1;
        "http:0" 1;
        "http:1" 0;
        "https:0" 0;
        "https:1" 0;
    }
    map $upstream_http_content_type $ingress_head {
        default '<head>';
        ~^text/html '<head><script src="$ingress_path/__unifi_ingress_adapter.js" data-http-compat="$ingress_http_compat_enabled"></script>';
    }

    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;
        absolute_redirect off;
        client_max_body_size 1g;

        if ($ingress_path = "") {
            return 400;
        }

        location = /__unifi_ingress_adapter.js {
            alias /usr/share/unifi-os/ingress-adapter.js;
            default_type application/javascript;
            etag off;
            add_header Cache-Control "no-store" always;
        }

        location = /ha/login_redirect/ {
            js_content ingress_login.redirect;
        }

        location = /ha/login_redirect.js {
            alias /usr/share/unifi-os/ingress-login-redirect.js;
            default_type application/javascript;
            etag off;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location / {
            # Cover existing sidebar/Open Web UI/deep-link entries too. Unsafe
            # methods end at the bridge with 426; credentials are never replayed.
            if ($ingress_needs_secure_login = 1) {
                rewrite ^ /ha/login_redirect/ last;
            }
            # Supervisor already strips the ingress prefix from requests.
            # This fixed loopback destination cannot be selected by the client.
            proxy_pass https://127.0.0.1:11443;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $ingress_forwarded_proto;
            # Always the Supervisor's address: Supervisor terminates the browser
            # connection, and its client address headers are not trusted here.
            proxy_set_header X-Forwarded-For $remote_addr;
            # The token-bearing ingress path is routing metadata for this proxy
            # only; the vendor console does not use it and must not log it.
            proxy_set_header X-Ingress-Path "";
            # An empty result omits the header entirely.
            proxy_set_header Cookie $ingress_upstream_cookie;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $ingress_connection;
            proxy_set_header Accept-Encoding "";
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            # The unchanged local vendor console uses a self-signed certificate.
            # Verification is disabled only for this fixed loopback TLS hop.
            proxy_ssl_verify off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;

            # First match wins. Locations that already carry this ingress path
            # are kept as-is; relative /api/hassio_ingress/ paths are never
            # prefixed again.
            proxy_redirect https://127.0.0.1:11443$ingress_path/ $ingress_path/;
            proxy_redirect https://$http_host$ingress_path/ $ingress_path/;
            proxy_redirect http://$http_host$ingress_path/ $ingress_path/;
            proxy_redirect https://127.0.0.1:11443/ $ingress_path/;
            proxy_redirect https://$http_host/ $ingress_path/;
            proxy_redirect http://$http_host/ $ingress_path/;
            proxy_redirect ~^(/(?!/)(?!api/hassio_ingress/).*)$ $ingress_path$1;
            proxy_cookie_path ~^/(.*)$ $ingress_path/$1;
            # Explicit operator opt-in only; never changes direct HTTPS cookies.
            js_header_filter ingress_cookies.filter;

            # Do not cache token-specific rewritten assets at the HA origin.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header ETag;
            # HSTS for the shared HA origin belongs to HA's HTTPS endpoint.
            proxy_hide_header Strict-Transport-Security;
            # The HA origin's storage, cookies and service-worker scopes belong
            # to Home Assistant. Vendor responses must not clear or widen them.
            proxy_hide_header Clear-Site-Data;
            proxy_hide_header Service-Worker-Allowed;
            add_header Cache-Control "no-store" always;
            sub_filter_once off;
            sub_filter_types text/css application/javascript text/javascript;
            # Install before vendor scripts execute. Virtual browser-location
            # reads keep the SPA router's logical paths independent of HA's prefix.
            sub_filter '<head>' $ingress_head;
            # Match window.location only as a whole identifier, followed by one
            # of these punctuators or whitespace; never window.locationbar etc.
            # nginx matches sub_filter strings case-insensitively.
            sub_filter 'window.location.' 'window.__unifiIngress.location.';
            sub_filter 'window.location)' 'window.__unifiIngress.location)';
            sub_filter 'window.location,' 'window.__unifiIngress.location,';
            sub_filter 'window.location;' 'window.__unifiIngress.location;';
            sub_filter 'window.location}' 'window.__unifiIngress.location}';
            sub_filter 'window.location]' 'window.__unifiIngress.location]';
            sub_filter 'window.location[' 'window.__unifiIngress.location[';
            sub_filter 'window.location=' 'window.__unifiIngress.location=';
            sub_filter 'window.location!' 'window.__unifiIngress.location!';
            sub_filter 'window.location?' 'window.__unifiIngress.location?';
            sub_filter 'window.location:' 'window.__unifiIngress.location:';
            sub_filter 'window.location&' 'window.__unifiIngress.location&';
            sub_filter 'window.location|' 'window.__unifiIngress.location|';
            sub_filter 'window.location<' 'window.__unifiIngress.location<';
            sub_filter 'window.location>' 'window.__unifiIngress.location>';
            sub_filter 'window.location+' 'window.__unifiIngress.location+';
            sub_filter 'window.location-' 'window.__unifiIngress.location-';
            sub_filter 'window.location*' 'window.__unifiIngress.location*';
            sub_filter 'window.location/' 'window.__unifiIngress.location/';
            sub_filter 'window.location%' 'window.__unifiIngress.location%';
            sub_filter 'window.location^' 'window.__unifiIngress.location^';
            sub_filter 'window.location ' 'window.__unifiIngress.location ';
            sub_filter 'window.location\n' 'window.__unifiIngress.location\n';
            sub_filter 'window.location\r' 'window.__unifiIngress.location\r';
            sub_filter 'window.location\t' 'window.__unifiIngress.location\t';
            # Pinned 5.1.42 local-login URL builder destructures window.location.
            # Only code that names window.location, or matches a pinned pattern
            # below, is rewritten. Code that reads document.location or a bare
            # location sees the real URL; nothing is exempted deliberately.
            sub_filter 'let{location:{pathname:t}}=window' 'let{location:{pathname:t}}={location:window.__unifiIngress.location}';
            # Pinned 5.1.42 webpack runtime public path (__webpack_require__.p).
            # The bundles' surrounding runtime tokens are not pinned here, so
            # this stays a short literal: any other '.p="/"' in a served script
            # is rewritten too. Re-verify against each new vendor bundle.
            sub_filter '.p="/"' '.p="$ingress_path/"';
            # Pinned Core portal's release-channel preference writer. Its Secure
            # cookie causes a reload loop for Early Access users on HTTP. Do not
            # relax arbitrary client cookies or replace the account's role checks.
            sub_filter 'f=e=>{l.A.set(p,e,{expires:32,path:"/",sameSite:"lax",secure:!0})}' 'f=e=>{l.A.set(p,e,{expires:32,path:"$ingress_path/",sameSite:"lax",secure:window.__unifiIngress.cookieSecure})}';
            # Protect protocol-relative external URLs from the shorter matches.
            sub_filter 'src="//' 'src="//';
            sub_filter 'href="//' 'href="//';
            sub_filter 'action="//' 'action="//';
            sub_filter '"url":"//' '"url":"//';
            sub_filter 'url(//' 'url(//';
            sub_filter 'url("//' 'url("//';
            sub_filter 'url(\'//' 'url(\'//';
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';
            sub_filter '"url":"/' '"url":"$ingress_path/';
            sub_filter 'url(/' 'url($ingress_path/';
            sub_filter 'url("/' 'url("$ingress_path/';
            sub_filter 'url(\'/' 'url(\'$ingress_path/';
            # Keep vendor API path constants logical: the dynamic Network adapter
            # joins its base URL with /api/self. Prefixing those constants here
            # corrupts the joined URL. Browser fetch/XHR/WebSocket hooks scope the
            # final request once, after the vendor's URL construction.
        }
    }
}
