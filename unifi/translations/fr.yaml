---
configuration:
  log_level:
    name: Niveau de journalisation
    description: >-
      Contrôle le niveau de détails des journaux fournis par l'extension.
  memory_max:
    name: Mémoire maximale
    description: >-
      Mémoire Java maximale (heap), en Mo, de l'application UniFi Network dans
      UniFi OS. Laissez vide pour utiliser la valeur par défaut d'Ubiquiti. Ne
      limite pas UniFi OS dans son ensemble.
  memory_init:
    name: Mémoire initiale
    description: >-
      Mémoire Java initiale (heap), en Mo, de l'application UniFi Network dans
      UniFi OS. Ne doit pas dépasser la mémoire maximale. Laissez vide pour
      utiliser la valeur par défaut d'Ubiquiti.
  ingress_allow_insecure_http:
    name: Autoriser l'ingress HTTP non sécurisé
    description: >-
      Désactivé par défaut. Permet d'ouvrir la console UniFi dans Home
      Assistant lorsque Home Assistant est accessible en HTTP simple, en
      retirant la protection Secure des cookies de connexion UniFi. Votre mot
      de passe et votre session UniFi circulent alors sans chiffrement. À
      utiliser uniquement sur un réseau de confiance ; HTTPS est fortement
      recommandé. N'affecte pas la console HTTPS directe. Redémarrez
      l'application après modification.
network:
  161/udp: Conservé de la version précédente (SNMP) ; l'application n'ajoute aucun service SNMP
  1900/udp: Conservé de la version précédente (SSDP) ; l'application n'ajoute aucun service SSDP
  3478/udp: STUN
  5514/udp: Syslog distant des appareils UniFi
  5671/tcp: Autre service UniFi OS
  6789/tcp: Test de vitesse UniFi Mobile
  8080/tcp: Inform des appareils (communication entre appareils et contrôleur)
  8443/tcp: Ancien port de la console (relayé vers la console UniFi OS, 11443/TCP)
  8843/tcp: Ancien port du portail invité HTTPS (relayé vers 8444/TCP)
  8880/tcp: Portail invité HTTP
  8881/tcp: Autre service UniFi OS
  8882/tcp: Autre service UniFi OS
  9543/tcp: UniFi Identity Hub
  10001/udp: Ancien port de découverte des appareils (relayé vers 10003/UDP)
  11443/tcp: Console UniFi OS (interface web HTTPS)
  8444/tcp: Portail invité HTTPS
  10003/udp: Découverte des appareils UniFi OS
  28082/tcp: Autre service UniFi OS
